{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fynncloud.fullname" . }}-server
  labels:
    {{- include "fynncloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.autoscaling.server.enabled }}
  replicas: {{ .Values.server.replicas }}
  {{- end }}
  strategy:
    type: {{ .Values.server.strategy.type | default "RollingUpdate" }}
    {{- if eq (.Values.server.strategy.type | default "RollingUpdate") "RollingUpdate" }}
    {{- with .Values.server.strategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "fynncloud.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      {{- with .Values.server.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "fynncloud.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
        {{- with .Values.server.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fynncloud.serviceAccountName" . }}
      {{- include "fynncloud.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.server.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgresql
          image: {{ include "fynncloud.busyboxImage" . | quote }}
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 {{ include "fynncloud.postgresql.host" . }}.{{ .Release.Namespace }}.svc.cluster.local {{ include "fynncloud.postgresql.port" . }}; do
                echo "Waiting for PostgreSQL at {{ include "fynncloud.postgresql.host" . }}:{{ include "fynncloud.postgresql.port" . }}..."
                sleep 2
              done
              echo "PostgreSQL is ready"
        {{- if .Values.server.storage.enabled }}
        - name: init-storage-permissions
          image: {{ include "fynncloud.busyboxImage" . | quote }}
          command:
            - sh
            - -c
            - |
              chown -R 995:995 /app/Storage && chmod -R 775 /app/Storage
          volumeMounts:
            - name: storage
              mountPath: /app/Storage
        {{- end }}
        {{- if or .Values.redis.enabled .Values.externalRedis.host .Values.externalRedis.url }}
        - name: wait-for-redis
          image: {{ include "fynncloud.busyboxImage" . | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 {{ include "fynncloud.redis.host" . }}.{{ .Release.Namespace }}.svc.cluster.local {{ include "fynncloud.redis.port" . }}; do
                echo "Waiting for Redis at {{ include "fynncloud.redis.host" . }}:{{ include "fynncloud.redis.port" . }}..."
                sleep 2
              done
              echo "Redis is ready"
        {{- end }}
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          {{- with .Values.server.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fynncloud.postgresql.secretName" . }}
                  key: {{ include "fynncloud.postgresql.secretKey" . }}
            - name: DATABASE_URL
              value: "postgresql://{{ include "fynncloud.postgresql.username" . }}:$(POSTGRES_PASSWORD)@{{ include "fynncloud.postgresql.host" . }}:{{ include "fynncloud.postgresql.port" . }}/{{ include "fynncloud.postgresql.database" . }}?sslmode={{ include "fynncloud.postgresql.sslMode" . }}"
            {{- if or .Values.redis.enabled .Values.externalRedis.host .Values.externalRedis.url }}
            - name: REDIS_URL
              value: {{ include "fynncloud.redis.url" . | quote }}
            {{- end }}
            - name: STORAGE_PATH
              value: "/app/Storage/"
            - name: APP_NAME
              value: {{ .Values.server.env.APP_NAME | quote }}
            - name: PRIMARY_COLOR
              value: {{ .Values.server.env.PRIMARY_COLOR | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fynncloud.jwt.secretName" . }}
                  key: jwt-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fynncloud.jwt.secretName" . }}
                  key: encryption-key
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.server.env.CORS_ALLOWED_ORIGINS | quote }}
            - name: FRONTEND_URL
              value: {{ .Values.server.env.FRONTEND_URL | quote }}
            - name: MAX_CHUNK_SIZE
              value: "{{ .Values.server.env.MAX_CHUNK_SIZE }}mb"
            - name: MAX_BODY_SIZE
              value: "{{ .Values.server.env.MAX_BODY_SIZE }}mb"
            {{- if .Values.s3.enabled }}
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: AWS_REGION
              value: {{ .Values.s3.region | default "us-east-1" | quote }}
            - name: AWS_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.s3.accessKeyId | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.s3.secretAccessKey | quote }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.server.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: storage
              mountPath: /app/Storage
            {{- with .Values.server.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: storage
          {{- if .Values.server.storage.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "fynncloud.fullname" . }}-server-storage
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.server.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
