{{- if and .Values.server.enabled .Values.server.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fynncloud.fullname" . }}-server-migrate
  labels:
    {{- include "fynncloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: server-migrate
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    {{- with .Values.server.migrate.podAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  template:
    metadata:
      labels:
        {{- include "fynncloud.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server-migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "fynncloud.serviceAccountName" . }}
      {{- include "fynncloud.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.server.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          {{- with .Values.server.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            {{- toYaml .Values.server.migrate.command | nindent 12 }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fynncloud.postgresql.secretName" . }}
                  key: {{ include "fynncloud.postgresql.secretKey" . }}
            - name: DATABASE_URL
              value: "postgresql://{{ include "fynncloud.postgresql.username" . }}:$(POSTGRES_PASSWORD)@{{ include "fynncloud.postgresql.host" . }}:{{ include "fynncloud.postgresql.port" . }}/{{ include "fynncloud.postgresql.database" . }}?sslmode={{ include "fynncloud.postgresql.sslMode" . }}"
            - name: STORAGE_PATH
              value: "/app/Storage/"
            - name: BRANDING_APP_NAME
              value: {{ default .Values.server.env.BRANDING_APP_NAME .Values.server.env.APP_NAME | quote }}
            - name: BRANDING_PRIMARY_COLOR
              value: {{ default .Values.server.env.BRANDING_PRIMARY_COLOR .Values.server.env.PRIMARY_COLOR | quote }}
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fynncloud.jwt.secretName" . }}
                  key: jwt-secret
            - name: SECURITY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fynncloud.jwt.secretName" . }}
                  key: encryption-key
            - name: SERVER_CORS_ALLOWED_ORIGINS
              value: {{ default .Values.server.env.SERVER_CORS_ALLOWED_ORIGINS .Values.server.env.CORS_ALLOWED_ORIGINS | quote }}
            - name: FRONTEND_URL
              value: {{ .Values.server.env.FRONTEND_URL | quote }}
            - name: MAX_CHUNK_SIZE
              value: "{{ .Values.server.env.MAX_CHUNK_SIZE }}mb"
            - name: MAX_BODY_SIZE
              value: "{{ default .Values.server.env.MAX_BODY_SIZE .Values.server.env.STORAGE_MAX_BODY_SIZE }}mb"
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: storage
              mountPath: /app/Storage
            {{- with .Values.server.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: storage
          emptyDir: {}
        {{- with .Values.server.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
