{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "fynncloud.httpRoute.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fynncloud.labels" . | nindent 4 }}
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- if .Values.httpRoute.parentRefs }}
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
    {{- else if .Values.gateway.enabled }}
    {{- /* Auto-reference the in-chart Gateway when no explicit parentRefs are set */}}
    - name: {{ include "fynncloud.gateway.name" . }}
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.httpRoute.rules }}
    {{- /* ── User-defined rules (full override) ── */}}
    {{- range .Values.httpRoute.rules }}
    - matches:
        {{- toYaml .matches | nindent 8 }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serverRefs:
        {{- toYaml .serverRefs | nindent 8 }}
    {{- end }}
    {{- else }}
    {{- /* ── Auto-generated rules from server/web services ── */}}
    {{- if .Values.server.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /api
      serverRefs:
        - name: {{ include "fynncloud.fullname" . }}-server
          port: {{ .Values.server.service.port }}
    {{- end }}
    {{- if .Values.web.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      serverRefs:
        - name: {{ include "fynncloud.fullname" . }}-web
          port: {{ .Values.web.service.port }}
    {{- end }}
    {{- end }}
{{- end }}