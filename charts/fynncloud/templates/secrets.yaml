{{/*
Only create the chart-managed secret when:
- CNPG is disabled AND
  no existingSecret is specified for external postgresql, OR
- No existingSecret is specified for the server (JWT secret)
CNPG automatically manages its own secrets ("-app").
*/}}
{{- $needsPostgresSecret := and (not .Values.cnpg.enabled) (not .Values.externalPostgresql.existingSecret) .Values.externalPostgresql.password }}
{{- $needsJwtSecret := not .Values.server.existingSecret }}
{{- $needsLiveKitSecret := and .Values.livekit .Values.livekit.enabled (not .Values.livekit.auth.existingSecret) }}
{{- if or $needsPostgresSecret $needsJwtSecret $needsLiveKitSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fynncloud.fullname" . }}-secrets
  labels:
    {{- include "fynncloud.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $needsPostgresSecret }}
  postgres-password: {{ .Values.externalPostgresql.password | b64enc | quote }}
  {{- end }}
  {{- if $needsJwtSecret }}
  jwt-secret: {{ (.Values.server.env.JWT_SECRET | default "changeme") | b64enc | quote }}
  encryption-key: {{ (.Values.server.env.ENCRYPTION_KEY | default "changeme") | b64enc | quote }}
  {{- end }}
  {{- if $needsLiveKitSecret }}
  livekit-api-key: {{ (.Values.livekit.auth.apiKey | default "APIfynncloud") | b64enc | quote }}
  livekit-api-secret: {{ (.Values.livekit.auth.apiSecret | default "") | b64enc | quote }}
  {{- end }}
{{- end }}
