# =============================================================================
# FynnCloud Helm Chart - values.yaml
# =============================================================================
nameOverride: ""
fullnameOverride: ""

# -- Global settings shared across all sub-components
global:
  # -- Pull secrets for private container registries
  imagePullSecrets:
  - name: regcred
  #   - name: my-registry-secret
  # -- Default StorageClass (components can override individually)
  storageClass: ""
  # -- Busybox image used for dependency check initContainers
  busyboxImage: "busybox:1.36"

# =============================================================================
# Service Account
# =============================================================================
serviceAccount:
  # -- Create a ServiceAccount for pods
  create: true
  # -- Annotations to add (e.g. for IAM roles)
  annotations: {}
  # -- Override the generated name
  name: ""
  # -- Automount API credentials
  automountServiceAccountToken: false

# =============================================================================
# CloudNativePG Configuration
# =============================================================================
# Requires the CloudNativePG operator to be installed in the cluster.
# https://cloudnative-pg.io/
cnpg:
  enabled: true
  # -- Suffix for the Cluster resource name
  name: "cluster"
  instances: 3

  # -- SSL Mode for connection string (disable, require, verify-ca, etc.)
  sslMode: "disable"

  # -- Storage configuration for the PVCs
  storage:
    size: 1Gi
    # storageClass: ""

  # -- Bootstrap configuration
  bootstrap:
    initdb:
      database: fynncloud
      owner: fynncloud
      secret:
        name: fynncloud-cnpg-initial-password

  # -- Backup configuration (example structure, adjust as needed)
  # backup:
  #   barmanObjectStore:
  #     destinationPath: s3://bucket/path
  #     endpointURL: http://minio:9000
  #     s3Credentials: ...

# =============================================================================
# External PostgreSQL
# =============================================================================
# Use when you have an existing PostgreSQL instance (e.g. RDS, Cloud SQL)
# and don't want the chart to deploy CNPG. Requires cnpg.enabled=false.
externalPostgresql:
  host: ""
  port: 5432
  username: fynncloud
  password: ""
  database: fynncloud
  sslMode: "require"
  # -- Name of an existing Secret containing the key `postgres-password`
  existingSecret: ""

# =============================================================================
# Redis Configuration
# =============================================================================
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 6379
    annotations: {}

  persistence:
    enabled: true
    size: 5Gi
    accessMode: ReadWriteOnce
    # storageClass: ""
    # existingClaim: ""

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# External Redis
# =============================================================================
# Used when redis.enabled=false and you connect to an external Redis instance
externalRedis:
  host: ""
  port: 6379
  url: ""

# =============================================================================
# Server Configuration
# =============================================================================
server:
  enabled: true
  image:
    repository: ghcr.io/fynncloudproject/server
    tag: latest
    pullPolicy: Always
  replicas: 1

  # -- Override the container command (leave empty to use image entrypoint)
  command: []
  # -- Override the container args (leave empty to use image CMD)
  args: []

  # -- Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  # -- Application environment variables
  env:
    BRANDING_APP_NAME: "FynnCloud"
    BRANDING_PRIMARY_COLOR: "#007bff"
    SERVER_CORS_ALLOWED_ORIGINS: "*"
    APP_FRONTEND_URL: "http://localhost"
    STORAGE_MAX_CHUNK_SIZE: "100"
    MAX_BODY_SIZE: "100"
    # Legacy aliases (backward compatibility)
    APP_NAME: ""
    PRIMARY_COLOR: ""
    CORS_ALLOWED_ORIGINS: ""
    FRONTEND_URL: ""
    MAX_CHUNK_SIZE: ""
    STORAGE_MAX_BODY_SIZE: ""

  # -- Name of an existing Secret with a `jwt-secret` key
  existingSecret: ""

  # -- Database migration job configuration
  migrate:
    enabled: true
    # -- Command to run the database migrations
    command: ["./FynnCloudServer", "migrate", "-y"]
    # -- Annotations to apply to the migration pod (or job if moved)
    # Using ArgoCD Sync hooks to bypass Job immutability constraints.
    # The Sync hook safely runs alongside other resources being created.
    podAnnotations:
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

  # -- Additional environment variables (list of name/value or valueFrom)
  extraEnv: []
  #   - name: MY_VAR
  #     value: "my-value"

  # -- Extra volume mounts for the server container
  extraVolumeMounts: []
  # -- Extra volumes for the server pod
  extraVolumes: []

  storage:
    enabled: true
    size: 5Gi
    accessMode: ReadWriteOnce
    # storageClass: ""

  resources: {}
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi

  # -- Pod-level security context
  podSecurityContext:
    fsGroup: 995
    fsGroupChangePolicy: "OnRootMismatch"
  #   runAsNonRoot: true
  #   runAsUser: 1000
  #   runAsGroup: 1000
  #   fsGroup: 1000

  # -- Container-level security context
  securityContext: {}
  #   allowPrivilegeEscalation: false
  #   readOnlyRootFilesystem: false
  #   capabilities:
  #     drop:
  #       - ALL

  # -- Startup probe (allows slow starts without killing the pod)
  startupProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 30

  livenessProbe:
    tcpSocket:
      port: 8080
    periodSeconds: 30

  readinessProbe:
    tcpSocket:
      port: 8080
    periodSeconds: 10

  # -- Additional pod annotations
  podAnnotations: {}
  # -- Additional pod labels
  podLabels: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- Topology spread constraints for HA
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: server

# =============================================================================
# Web Frontend Configuration
# =============================================================================
web:
  enabled: true
  image:
    repository: ghcr.io/fynncloudproject/web
    tag: latest
    pullPolicy: Always
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  service:
    type: ClusterIP
    port: 80
    annotations: {}

  # -- Additional environment variables
  extraEnv: []
  # -- Extra volume mounts for the web container
  extraVolumeMounts: []
  # -- Extra volumes for the web pod
  extraVolumes: []

  resources: {}

  podSecurityContext: {}
  securityContext: {}

  startupProbe:
    tcpSocket:
      port: http
    failureThreshold: 30
    periodSeconds: 5

  livenessProbe:
    tcpSocket:
      port: http
    periodSeconds: 30

  readinessProbe:
    tcpSocket:
      port: http
    periodSeconds: 10

  podAnnotations: {}
  podLabels: {}

  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: web

# =============================================================================
# Gateway API - Gateway Resource (optional)
# =============================================================================
# Creates a Gateway resource in-chart. Disable this and configure
# httpRoute.parentRefs manually if you bring your own Gateway.
gateway:
  enabled: false
  # -- Name override for the Gateway resource
  nameOverride: ""
  # -- GatewayClass name (e.g. "eg" for Envoy Gateway, "istio", "cilium")
  gatewayClassName: "eg"
  # -- Annotations for the Gateway resource
  annotations: {}
  # -- Labels for the Gateway resource
  labels: {}
  # -- Gateway listeners
  listeners:
    - name: http
      protocol: HTTP
      port: 3000
      allowedRoutes:
        namespaces:
          from: Same
    # - name: https
    #   protocol: HTTPS
    #   port: 443
    #   tls:
    #     mode: Terminate
    #     certificateRefs:
    #       - kind: Secret
    #         name: my-tls-secret
    #   allowedRoutes:
    #     namespaces:
    #       from: Same
  # -- Addresses (optional, e.g. for static IP)
  addresses: []
  #   - type: IPAddress
  #     value: "1.2.3.4"

# =============================================================================
# Gateway API - HTTPRoute Configuration
# =============================================================================
# Requires a Gateway API implementation (e.g. Envoy Gateway, Istio, Cilium,
# NGINX Gateway Fabric, Traefik) and a Gateway resource to be deployed.
#
# When httpRoute.rules is empty (default), the chart auto-generates two rules:
#   /api  → server service
#   /     → web frontend service
# Set httpRoute.rules explicitly to override this behaviour.
httpRoute:
  # -- Enable creation of HTTPRoute resource
  enabled: false

  # -- Name override for HTTPRoute resource
  nameOverride: ""

  # -- Hostnames to match (leave empty to match all hostnames on the Gateway)
  # Example:
  #   hostnames:
  #     - fynncloud.example.com
  hostnames: []

  # -- Parent Gateway references (required - attaches the route to a Gateway)
  # When gateway.enabled=true you can leave this empty and the chart will
  # auto-reference the in-chart Gateway.
  # Example:
  #   parentRefs:
  #     - name: my-gateway
  #       namespace: gateway-system
  #       sectionName: https     # optional: target a specific listener
  parentRefs: []

  # -- Annotations for HTTPRoute resource
  annotations: {}

  # -- Labels for HTTPRoute resource
  labels: {}

  # -- Explicit routing rules (overrides auto-generated rules when set)
  # Each rule needs `matches` and `serverRefs`. Optional `filters`.
  #
  # Example:
  #   rules:
  #     - matches:
  #         - path:
  #             type: PathPrefix
  #             value: /api
  #       filters:
  #         - type: RequestHeaderModifier
  #           requestHeaderModifier:
  #             set:
  #               - name: X-Forwarded-Proto
  #                 value: https
  #       backendRefs:
  #         - name: my-server
  #           port: 8080
  #           weight: 100
  #     - matches:
  #         - path:
  #             type: PathPrefix
  #             value: /
  #       backendRefs:
  #         - name: my-web
  #           port: 3000
  rules: []

# =============================================================================
# Ingress Configuration (legacy - prefer Gateway API)
# =============================================================================
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: ""
      paths:
        - path: /api
          pathType: Prefix
          service: server
        - path: /
          pathType: Prefix
          service: web
  tls: []

# =============================================================================
# Autoscaling (HorizontalPodAutoscaler)
# =============================================================================
autoscaling:
  server:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  web:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

# =============================================================================
# Pod Disruption Budgets
# =============================================================================
podDisruptionBudget:
  server:
    enabled: false
    # -- Minimum available pods (mutually exclusive with maxUnavailable)
    minAvailable: 1
    # maxUnavailable: 1
  web:
    enabled: false
    minAvailable: 1

# =============================================================================
# Network Policies
# =============================================================================
networkPolicy:
  enabled: false
  # -- Additional ingress rules
  extraIngress: []
  # -- Additional egress rules
  extraEgress: []


# =============================================================================
# S3 Object Storage Configuration
# =============================================================================
s3:
  enabled: true
  bucket: "fynncloud"
  endpoint: "https://nbg1.your-objectstorage.com"
  region: "nbg1"
  accessKeyId: "1YE4Y8RHJOCH1FVBFCDB"
  secretAccessKey: "SgcWRouVtLXfmVFlbQPvD1EhN5DM1F0kw5CrYXvr"

# =============================================================================
# Semantic Search & Embeddings Configuration (OpenAI-compatible)
# =============================================================================
embeddings:
  # -- Enable semantic file search via an OpenAI-compatible embeddings service
  enabled: false
  # -- Base URL of the OpenAI-compatible embedding service (e.g. http://embeddings:8000/v1 or https://api.openai.com/v1)
  url: ""
  # -- Model identifier to request from the embedding provider
  model: "jinaai/jina-clip-v2"
  # -- API key if connecting to an authenticated provider (leave empty if unauthenticated)
  apiKey: ""
  # -- Name of an existing Secret containing the embedding API key
  existingSecret: ""
  # -- Key within existingSecret containing the API key (default: embedding-api-key)
  secretKey: "embedding-api-key"

# =============================================================================
# LiveKit WebRTC SFU & Embedded TURN Configuration
# =============================================================================
# Enables scalable audio/video/screen-sharing calls and 4G CGNAT/NAT64 traversal.
# Runs with hostNetwork: true so single-port UDP mux (7882/udp), ICE/TCP (7881/tcp),
# and embedded TURN (3478/udp, optional 5349/tcp) bind directly to the worker node's
# public IPv4/IPv6 interfaces without K8s CNI SNAT or TCP-only LoadBalancer bottlenecks.
livekit:
  enabled: false
  image:
    repository: livekit/livekit-server
    tag: v1.13.11
    pullPolicy: IfNotPresent
  replicas: 1
  logLevel: "info"

  # -- Bind directly to node network interfaces for WebRTC UDP/TCP & TURN media
  hostNetwork: true
  terminationGracePeriodSeconds: 300

  strategy:
    type: Recreate

  service:
    type: ClusterIP
    port: 7880
    annotations: {}

  # -- Optional browser-facing signaling URL override (defaults to wss://<hostname>/livekit)
  publicUrl: ""
  # -- Optional internal Twirp HTTP URL override
  internalUrl: ""

  rtc:
    # -- Single-port UDP mux for WebRTC media (open on worker node firewall)
    udpPort: 7882
    # -- ICE-over-TCP fallback port (open on worker node firewall)
    tcpPort: 7881
    # -- Discover worker node's public IP automatically via STUN
    useExternalIP: true
    # -- Optional explicit public IP override (disables STUN auto-discovery when set)
    nodeIP: ""

  turn:
    # -- Enable LiveKit's embedded TURN relay for restrictive 4G CGNAT / corporate firewalls
    enabled: true
    udpPort: 3478
    # -- Optional DNS hostname pointing to the LiveKit worker node IP (enables NAT64 hostname resolution & TURN/TLS)
    domain: ""
    tlsPort: 5349
    # -- Kubernetes TLS Secret (tls.crt / tls.key) matching `turn.domain` to enable TURN/TLS on `tlsPort`
    tlsSecretName: ""

  auth:
    apiKey: "APIfynncloud"
    apiSecret: "changeme-generate-at-least-32-char-random-secret"
    existingSecret: ""
    apiKeySecretKey: "livekit-api-key"
    apiSecretSecretKey: "livekit-api-secret"

  extraEnv: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 2000m
      memory: 1Gi

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
