services:
  proxy:
    image: nginx:latest
    container_name: fynncloud-proxy-dev
    restart: unless-stopped
    depends_on:
      - server
      - web
    volumes:
      - ./nginx-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - MAX_BODY_SIZE=${MAX_BODY_SIZE:-100}
    networks:
      - fynncloud-network
    ports:
      - "${PROXY_PORT:-80}:80"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:80/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: pgvector/pgvector:pg16
    container_name: fynncloud-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: fynncloud
      POSTGRES_USER: fynncloud
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - fynncloud-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fynncloud -d fynncloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fynncloud-redis-dev
    restart: unless-stopped
    networks:
      - fynncloud-network
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: repo.fynncloud.ch/server:latest
    container_name: fynncloud-server-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fynncloud:${DB_PASSWORD}@db:5432/fynncloud
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      EMBEDDING_URL: ${EMBEDDING_URL}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      STORAGE_PATH: /app/Storage/
      APP_NAME: ${APP_NAME:-FynnCloud}
      PRIMARY_COLOR: ${PRIMARY_COLOR:-blue}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      FRONTEND_URL: ${FRONTEND_URL}
      MAX_CHUNK_SIZE: ${MAX_CHUNK_SIZE:-100}mb
      MAX_BODY_SIZE: ${MAX_BODY_SIZE:-100}mb
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      DOCUMENT_SERVER_URL: ${DOCUMENT_SERVER_URL}
      OFFICE_PROVIDER: ${OFFICE_PROVIDER:-eurooffice}
      EUROOFFICE_JWT_SECRET: ${EUROOFFICE_JWT_SECRET:-dev_eurooffice_secret_32_chars_min}
      WOPI_PUBLIC_URL: ${WOPI_PUBLIC_URL}
      # Optional S3 Storage
      S3_BUCKET: ${S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_ENDPOINT: ${AWS_ENDPOINT}
    volumes:
      - server_storage_dev:/app/Storage
    networks:
      - fynncloud-network
    ports:
      - "${SERVER_PORT:-8080}:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: repo.fynncloud.ch/web:latest
    container_name: fynncloud-web-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
      NUXT_PUBLIC_MAINTENANCE_MODE: ${NUXT_PUBLIC_MAINTENANCE_MODE:-false}
    networks:
      - fynncloud-network
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  adminer:
    image: adminer:latest
    container_name: fynncloud-adminer
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - fynncloud-network
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DEFAULT_DB: fynncloud
      ADMINER_DEFAULT_USER: fynncloud
      ADMINER_DEFAULT_PASS: ${DB_PASSWORD}
      ADMINER_DESIGN: "pepa-linha"

  eurooffice:
    image: ghcr.io/euro-office/documentserver:latest
    container_name: fynncloud-eurooffice-dev
    restart: unless-stopped
    environment:
      WOPI_ENABLED: "true"
      JWT_ENABLED: "true"
      JWT_SECRET: ${EUROOFFICE_JWT_SECRET:-dev_eurooffice_secret_32_chars_min}
      EXAMPLE_ENABLED: "false"
      ADMINPANEL_ENABLED: "false"
    networks:
      - fynncloud-network
    ports:
      - "${EUROOFFICE_PORT:-8082}:80"
    volumes:
      - onlyoffice_data_dev:/var/www/onlyoffice/Data
      - onlyoffice_log_dev:/var/log/onlyoffice
      - onlyoffice_lib_dev:/var/lib/onlyoffice
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/hosting/discovery"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  fynncloud-network:
    driver: bridge

volumes:
  postgres_data_dev:
  server_storage_dev:
  redis_data_dev:
  onlyoffice_data_dev:
  onlyoffice_log_dev:
  onlyoffice_lib_dev:
